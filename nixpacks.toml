# Nixpacks configuration for Root Deployment
[phases.setup]
nixPkgs = ["python310", "gcc"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r backend/requirements.txt",
  "python -m spacy download en_core_web_sm"
]

[start]
cmd = "cd backend && uvicorn api.main:app --host 0.0.0.0 --port ${PORT:-8000}"
